version: '3.8'

services:
  frontend:
    build:
      context: ./Client
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - perfume-network
    restart: unless-stopped

  backend:
    build:
      context: ./perfume-backend
    ports:
      - "5000:5000"
    env_file:
      - ./perfume-backend/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/perfume-store
    depends_on:
      - mongodb
    networks:
      - perfume-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - perfume-network
    restart: unless-stopped

networks:
  perfume-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
